services:
  openwa:
    image: openwa/wa-automate:latest
    container_name: ephrad_openwa
    restart: unless-stopped
    ports:
      - "8080:8080" # OpenWA API Gateway
    environment:
      - WA_BROWSER_WS_ENDPOINT=
    command: >
      --webhook "http://host.docker.internal:3000/api/webhooks/whatsapp"
      --session "ephrad_session"
      --qr-timeout 0
      --kill-client-on-logout
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./openwa_data:/app/session
    networks:
      - ephrad_net

networks:
  ephrad_net:
    driver: bridge
